<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiosco · ELIFEST 22</title>
<style>
:root{--bg:#12121a;--card:#1e1e2b;--tx:#f2f2f7;--mut:#9a9ab0;--ac:#ffb830}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:22px/1.4 system-ui,sans-serif;padding:20px}
#banner{border-radius:24px;padding:28px;text-align:center;background:var(--card);margin-bottom:20px}
#banner.bet{background:#b3261e;animation:pulse 1s infinite}
#banner.bet.last{animation:pulse .35s infinite}
@keyframes pulse{50%{background:#ff6a00;transform:scale(1.01)}}
.huge{font-size:min(22vw,200px);font-weight:900;line-height:1;margin:6px 0}
.t1{font-size:min(7vw,64px);font-weight:900}.t2{font-size:min(5vw,44px)}
.bars{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:26px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #2a2a3a}
.row span{flex:1}
input,button{font:inherit;padding:12px;border-radius:10px;border:0}
input{background:#2a2a3a;color:var(--tx);width:90px;text-align:center}
button{background:var(--ac);color:#111;font-weight:700;cursor:pointer}
.chip{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe08a,#ffb830 60%,#c98a00);border:.12em solid #c98a00;box-shadow:inset 0 0 0 .1em rgba(255,255,255,.35);vertical-align:-.12em}
</style><script src="/teams.js"></script></head><body>
<div id="banner">Cargando…</div>
<div class="card"><b>Cargar resultado</b> <a href="/tv" style="float:right;color:var(--ac)">📺 Ver TV</a>
  <div id="auth"></div>
  <div id="results"></div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var startEnd=0,bt=null,end=0,pw='',ver=-1,tn=[];
try{pw=localStorage.getItem('kpw')||''}catch(e){}
function cdo(){var s=Math.max(0,Math.round((startEnd-Date.now())/1000));return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function cd(){var s=Math.max(0,Math.round((end-Date.now())/1000));return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}

function banner(){
  var b=$('banner');
  if(!bt||!bt.match){b.className='';b.innerHTML='<div class="t2">Esperando el próximo partido…</div>';return}
  var mt=bt.match,vs=esc(mt.a.name)+' <span style="color:var(--mut)">vs</span> '+esc(mt.b.name);
  if(mt.status==='reported'||mt.status==='disputed'){
    b.className='';
    b.innerHTML='<div class="t2" style="color:var(--mut)">'+esc(mt.tournament)+'</div><div class="t1">'+(mt.status==='reported'?'✋ FALTA CONFIRMAR EL RESULTADO':'⚠️ RESULTADO EN DISPUTA')+'</div><div class="t1">'+vs+'</div><div class="t2" style="margin-top:10px">'+(mt.status==='reported'?'El rival tiene que confirmar, o cargalo acá abajo':'Cargá el resultado correcto acá abajo')+' para pasar al próximo partido</div>';
    return;
  }
  if(bt.cooldown){
    b.className='';
    b.innerHTML='<div class="t2" style="color:var(--mut)">'+esc(mt.tournament)+'</div><div class="t1">⏳ PRÓXIMO PARTIDO</div><div class="t1">'+vs+'</div><div class="t2" style="margin-top:10px">Las apuestas abren en <b id="cdo">'+cdo()+'</b> · ¡preparen sus fichas!</div>';
    return;
  }
  if(bt.betting){
    var left=Math.round((end-Date.now())/1000);
    b.className='bet'+(left<=10?' last':'');
    b.innerHTML='<div class="t1">🎲 ¡HAGAN SUS APUESTAS!</div><div class="huge" id="big">'+cd()+'</div><div class="t2">'+vs+'</div>'+
      '<div class="bars"><span>'+esc(mt.a.name)+': '+mt.a.chips+' <span class="chip"></span> '+(mt.a.mult?'(x'+mt.a.mult.toFixed(2)+')':'')+'</span><span>'+esc(mt.b.name)+': '+mt.b.chips+' <span class="chip"></span> '+(mt.b.mult?'(x'+mt.b.mult.toFixed(2)+')':'')+'</span></div>'+
      '<div class="t2" style="margin-top:10px">Entrá a la página desde tu celu → 🎲 Apostar</div>';
  }else{
    b.className='';
    b.innerHTML='<div class="t2" style="color:var(--mut)">'+esc(mt.tournament)+'</div><div class="t1">🎮 JUEGAN AHORA</div><div class="t1">'+vs+'</div>'+
      '<div class="t2" style="margin-top:8px">Apuestas cerradas · pozo '+bt.pot+' <span class="chip"></span></div>';
  }
}
function tickBanner(){
  if(bt&&bt.cooldown){var o=$('cdo');if(o)o.textContent=cdo();if(Date.now()>=startEnd){bt.cooldown=false;fetch('/api/version').then(loadBet)}}
  if(bt&&bt.betting){
    if(Date.now()>=end){bt.betting=false;load();banner();return}
    var big=$('big');if(big)big.textContent=cd();
    $('banner').className='bet'+(Math.round((end-Date.now())/1000)<=10?' last':'');
  }
}
function loadBet(){
  fetch('/api/bets/current').then(function(r){return r.json()}).then(function(j){
    var was=bt&&bt.match&&bt.match.id, now=j.match&&j.match.id;
    bt=j;end=Date.now()+(j.secs_left||0)*1000;startEnd=Date.now()+(j.starts_in||0)*1000;
    banner();
  }).catch(function(){});
}
function authBox(){
  $('auth').innerHTML=pw?'<small style="color:var(--mut)">Admin activo en esta PC · <a href="#" onclick="logout();return false" style="color:var(--ac)">salir</a></small>':
    '<div><input id="pwin" type="password" style="width:240px" placeholder="Contraseña de admin"> <button onclick="savePw()">Habilitar</button></div>';
}
function savePw(){pw=$('pwin').value.trim();try{localStorage.setItem('kpw',pw)}catch(e){}authBox();results(true)}
function logout(){pw='';try{localStorage.removeItem('kpw')}catch(e){}authBox();results(true)}
function results(force){
  var ae=document.activeElement;if(!force&&ae&&ae.tagName==='INPUT')return;
  fetch('/api/tournaments').then(function(r){return r.json()}).then(function(ts){
    var h='';
    ts.forEach(function(t){
      var nm=function(id){var p=t.players.filter(function(x){return x.id===id})[0];return p?esc(p.name)+(p.team?' '+teamTag(p.team):''):'?'};
      t.matches.filter(function(x){return x.player_a&&x.player_b&&x.status!=='confirmed'}).forEach(function(x){
        h+='<div class="row"><span>'+(x.id===t.current_match_id?'▶ ':'')+nm(x.player_a)+' vs '+nm(x.player_b)+' <small style="color:var(--mut)">['+x.status+']</small></span>'+
          (pw?'<input id="ka'+x.id+'" type="tel" placeholder="A"><input id="kb'+x.id+'" type="tel" placeholder="B"><button onclick="send('+x.id+',this)">OK</button>':'')+'</div>';
      });
    });
    $('results').innerHTML=h||'<div style="color:var(--mut);padding:8px 0">No hay partidos pendientes</div>';
  });
}
function send(id,btn){
  if(btn){btn.disabled=true;btn.textContent='⏳'}
  fetch('/api/admin/matches/'+id+'/resolve',{method:'POST',headers:{'content-type':'application/json','x-admin-password':pw},
    body:JSON.stringify({score_a:$('ka'+id).value,score_b:$('kb'+id).value})}).then(function(r){return r.json()}).then(function(r){
    if(r.error){alert(r.error);if(/Contraseña/.test(r.error))logout()}
    results(true);loadBet();
  });
}
function poll(){
  fetch('/api/version').then(function(r){return r.json()}).then(function(j){
    if(j.v!==ver){ver=j.v;loadBet();results(false)}
  }).catch(function(){});
}
function load(){loadBet();results(false)}
authBox();poll();setInterval(poll,2500);setInterval(tickBanner,250);setInterval(loadBet,6000);
</script></body></html>
